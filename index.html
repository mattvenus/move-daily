<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6B4F"><meta name="apple-mobile-web-app-title" content="Move Daily">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232F6B4F'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='14' cy='5' r='1.8'/%3E%3Cpath d='M5 19l4-6 4 2 2-5 4 3M9 13l1-5 4-1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Move Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: Mac = left nav rail + working canvas; iPhone = single column + bottom tabs; session = dark full-screen focus */
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --fg:#18201B; --muted:#5E6B62; --line:#DDE3DB; --soft:#E8EDE6;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DDEBE2;
  --amber:#A85A1A; --amber-soft:#F5E6D8;
  --stretch:#1F7A7A; --stretch-soft:#DCEFEE; --pilates:#6B4FA0; --pilates-soft:#ECE6F5; --strength:#A85A1A; --strength-soft:#F5E6D8;
  --sess-bg:#0F1511; --sess-card:#18211B; --sess-fg:#EEF3EF; --sess-muted:#93A399; --sess-accent:#7BC29C;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --card:#1A221D; --fg:#E7EDE8; --muted:#9AA89F; --line:#2B362F; --soft:#222C25;
  --accent:#73B892; --accent-ink:#0E1A13; --accent-soft:#213529;
  --amber:#E09A5E; --amber-soft:#3A2A1C;
  --stretch:#5CC0BE; --stretch-soft:#183332; --pilates:#B39AE0; --pilates-soft:#2A2338; --strength:#E09A5E; --strength-soft:#3A2A1C;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111713; --card:#1A221D; --fg:#E7EDE8; --muted:#9AA89F; --line:#2B362F; --soft:#222C25;
  --accent:#73B892; --accent-ink:#0E1A13; --accent-soft:#213529;
  --amber:#E09A5E; --amber-soft:#3A2A1C;
  --stretch:#5CC0BE; --stretch-soft:#183332; --pilates:#B39AE0; --pilates-soft:#2A2338; --strength:#E09A5E; --strength-soft:#3A2A1C;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.05}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;padding:0 10px 22px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;text-align:left;font-weight:500;color:var(--muted);text-decoration:none}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--soft);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail-foot{margin-top:auto;padding:12px;font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--accent)}
main{min-width:0;padding-block:32px 48px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabs{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:20px 110px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
    padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));justify-content:space-around}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
}

/* building blocks */
.card{background:var(--card);border-radius:var(--r);padding:22px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{min-height:56px;padding:0 28px;font-size:17px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700}
.tag.stretch{background:var(--stretch-soft);color:var(--stretch)}
.tag.pilates{background:var(--pilates-soft);color:var(--pilates)}
.tag.strength{background:var(--strength-soft);color:var(--strength)}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line);display:inline-block}
.lvl i.on{background:var(--fg)}

/* today */
.hello{display:flex;flex-direction:column;gap:6px}
.nudge{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px}
.nudge .btn{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
.nudge .btn.solid{background:var(--accent-ink);color:var(--accent)}
.nudge small{opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mins{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--accent)}
.mins span{font-size:16px;font-weight:700;color:var(--muted);margin-left:4px}
.moves{list-style:none;margin:18px 0;padding:0;display:flex;flex-direction:column}
.moves li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.moves li:first-child{border-top:0}
.moves canvas{width:52px;height:52px;border-radius:10px;background:var(--soft)}
.moves .t{font-weight:700}
.moves .s{font-size:13px;color:var(--muted)}
.moves .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line)}
.dot.plan{border:2px solid var(--accent)}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.rest{border-style:solid;border-color:transparent;background:var(--soft)}
.day.today{color:var(--fg);font-weight:700}
.coach-note{display:flex;gap:14px;align-items:flex-start}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.changes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.changes li{display:flex;gap:8px}
.changes li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;margin-top:8px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px}
.months i{height:24px;border-radius:5px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--muted);font-weight:700}
.months i.done{background:var(--accent);color:var(--accent-ink)}
.months i.now{background:var(--amber-soft);color:var(--amber);outline:2px solid var(--amber)}

/* coach */
.chat{display:flex;flex-direction:column;gap:14px;min-height:320px}
.msg{max-width:min(620px,92%);padding:12px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.coach{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.thinking{color:var(--muted);font-style:italic}
.sess-card{margin-top:12px;padding:14px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;gap:10px;white-space:normal}
.sess-card ol{margin:0;padding-left:20px;font-size:14px}
.composer{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;padding-top:10px;background:var(--bg)}
@media (max-width:860px){.composer{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.composer textarea{flex:1;min-width:0;min-height:52px;max-height:160px;resize:none;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:14px 16px}
.icon-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:22px;height:22px}
.hint{font-size:13px;color:var(--muted)}

/* year */
.milestones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ms{border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:132px}
.ms .m{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ms .goal{font-weight:700;flex:1}
.ms.now{border:2px solid var(--amber);background:var(--amber-soft)}
.ms.now .m{color:var(--amber)}
.ms.done .m{color:var(--accent)}
.ms .state{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.ms.done .state{color:var(--accent);font-weight:700}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tests{grid-template-columns:minmax(0,1fr)}}
.test{border-radius:var(--r-sm);background:var(--soft);padding:16px;display:flex;flex-direction:column;gap:6px}
.test .now{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.test .delta{font-size:13px;font-weight:700;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input,.field select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}
@media (max-width:640px){.form3{grid-template-columns:minmax(0,1fr)}}

/* library */
.lib-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 18px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.mcard:hover{border-color:var(--accent)}
.mcard canvas{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:10px;background:var(--soft)}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row .lbl{min-width:0;flex:1 1 240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:transparent;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px}
.daychips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch{width:52px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
input[type="time"]{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.preview-list{display:flex;flex-direction:column;gap:10px}
.notif{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px}
.notif .ic{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.notif .what{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.notif .act{font-size:13px;font-weight:700;color:var(--accent);margin-top:4px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--sess-bg);color:var(--sess-fg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));color-scheme:dark}
.sess{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid #2C3A31;background:transparent;color:var(--sess-fg);display:grid;place-items:center}
.progress{display:flex;gap:4px;flex:1}
.progress i{flex:1;height:4px;border-radius:2px;background:#2C3A31}
.progress i.on{background:var(--sess-accent)}
.stage{background:var(--sess-card);border-radius:20px;aspect-ratio:16/11;max-width:100%;position:relative;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.sess h2{font-size:30px;font-weight:800}
.sess .rung{color:var(--sess-accent);font-weight:700;font-size:14px}
.counter{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bignum{font-family:var(--display);font-weight:800;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.bignum small{font-size:22px;color:var(--sess-muted);margin-left:6px}
.setcount{color:var(--sess-muted);text-align:right;font-weight:700}
.tip{background:var(--sess-card);border-radius:14px;padding:12px 14px;color:#C9D6CD;font-size:14px}
.sess-btns{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto}
.sbtn{min-height:60px;border-radius:18px;border:1px solid #2C3A31;background:transparent;color:var(--sess-fg);font-weight:700;font-size:16px}
.sbtn.go{background:var(--sess-accent);border-color:var(--sess-accent);color:#0F1511;font-size:19px}
.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.total{background:var(--sess-card);border-radius:14px;padding:14px;text-align:center}
.total b{display:block;font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.total span{font-size:12px;color:var(--sess-muted);text-transform:uppercase;letter-spacing:.06em}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{min-height:64px;border-radius:16px;border:1px solid #2C3A31;background:var(--sess-card);color:var(--sess-fg);font-weight:700;font-size:16px}
.rate button:hover{border-color:var(--sess-accent)}
.ms-bar{background:var(--sess-card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ms-bar .bar{background:#2C3A31}
.ms-bar .bar i{background:var(--sess-accent)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,16,12,.5);display:grid;place-items:center;padding:20px}
.sheet{background:var(--card);border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet canvas{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:14px;background:var(--soft)}
@media (max-width:860px){
  .sheet-bg{place-items:end stretch;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(22px, env(safe-area-inset-left,0px));padding-right:max(22px, env(safe-area-inset-right,0px))}
}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}

.ladder{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}

  const slots=minutes<=6?['warm',seed%2?'pilates':'strength','cool']:minutes<=11?['warm','pilates','strength','strength','cool']:['warm','warm','pilates','strength','pilates','strength','cool'];
  const used=new Set();const out=[];slots.forEach((s,k)=>{const pool=pools[s];for(let j=0;j<pool.length;j++){const id=pool[(seed+k*3+j)%pool.length];if(!used.has(id)){used.add(id);out.push(id);break}}});
  const sets=id=>M[id].type==='stretch'?1:Math.min(3,(minutes<=6?1:2)+(focus==='harder'?1:0));
  const titles={plan:'Today’s session',short:'Quick 5',stiff:'Loosen up',harder:'Step it up'};
  const reasons={plan:'',short:'Short and sweet. Five minutes still counts.',stiff:'Gentle on the back, with one strength move to keep you building.',harder:'One rung up and an extra set on each strength move.'};
  return {date:todayKey(),minutes,focus,title:titles[focus]||'Today’s session',reason:reasons[focus]||'',moves:out.map(id=>({id,sets:sets(id)})),harder:focus==='harder'}}
function todayPlan(){if(!S.today||S.today.date!==todayKey()){const sd=isSessionDay(now());S.today=sd?build(S.settings.length,'plan'):Object.assign(build(5,'stiff'),{title:'Rest-day stretch',reason:'Rest day. This is optional, a short stretch to keep you loose.',rest:true});save()}return S.today}

function lvl(n){return `<span class="lvl" aria-label="Level ${n} of 3">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}

function activeNudge(){const d=now();const h=d.getHours()+d.getMinutes()/60;const k=todayKey();if(h>=21||S.dismissed[k]||doneOn(k))return null;
  const st=S.settings,t=TONE[st.tone];const toH=s=>{const[a,b]=s.split(':').map(Number);return a+b/60};
  const slotH=toH(st.slot==='morning'?st.morning:st.evening);
  if(missedSessionDays()>=2)return {what:'Comeback',line:t.comeback,acts:[['five','Do 5 min',1],['dismiss','Not today']]};
  if(!isSessionDay(d))return h>=slotH?{what:'Rest-day stretch break',line:t.rest,acts:[['five','Do 5 min',1],['dismiss','Rest today']]}:null;
  if(st.slot==='morning'&&st.second&&h>=toH(st.evening))return {what:'Evening second chance',line:t.second,acts:[['five','Do 5 min',1],['dismiss','Rest today']]};
  if(h>=slotH)return {what:'Session reminder',line:t.session,acts:[['start','Start now',1],['five','Do 5 min'],['dismiss','Rest today']]};
  return null}

let run=null,tick=null,wake=null;

  try{navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  drawSession()}

   <div class="sess-btns"><button class="sbtn" data-act="toohard">Too hard</button><button class="sbtn go" data-act="done">Done</button><button class="sbtn" data-act="skip">Skip</button></div>
  </div></div>`);
  clearInterval(tick);if(timed){tick=setInterval(()=>{run.left=Math.max(0,run.left-1);const b=document.getElementById('big');if(b)b.firstChild.nodeValue=run.left;if(run.left===0){clearInterval(tick)}},1000)}}
function nextSet(completed){const mv=cur();if(completed){run.reps+=mv.t.unit==='reps'?mv.t.amount*(mv.t.sides?2:1):0}
  run.left=null;if(completed&&run.set<mv.sets){run.set++;return drawSession()}
  if(completed&&!run.done.includes(mv.id))run.done.push(mv.id);run.i++;run.set=1;if(run.i>=run.moves.length)return finish();drawSession()}
function tooHard(){const mv=cur();const m=M[mv.id];if(mv.t.rung>0){const r=mv.t.rung-1;mv.t={rung:r,name:m.ladder[r][0],amount:m.ladder[r][1],unit:m.unit,sides:!!m.sides};mv.dropped=true;
    S.progress[mv.id]={rung:Math.min(prog(mv.id).rung,r),bump:0};run.easier.push(mv.id);save();toast('Switched to an easier version');run.left=null;drawSession()}
  else{toast('That’s the easiest version. Skip it for today.');}}
function finish(){clearInterval(tick);const mins=Math.max(1,Math.round((Date.now()-run.start)/60000));run.mins=mins;
  const mi=monthIndex();const ms=MILESTONES[mi];const wk=sessionsThisWeek()+(doneOn(todayKey())?0:1);
  const msLine=mi===0?`${Math.min(wk,3)} of 3 sessions this week`:`${ms[1]}: ${ms[2]}`;const pct=mi===0?Math.min(100,wk/3*100):Math.round((new Date().getDate()/30)*100);
  layer(`<div class="overlay" role="dialog" aria-modal="true" aria-label="Session complete"><div class="sess">
   <div class="done-hero"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38" fill="none" stroke="var(--sess-accent)" stroke-width="5"/><path d="M26 43l11 11 21-24" fill="none" stroke="var(--sess-accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Session done.</h2><p style="color:var(--sess-muted)">That’s another step on the year path.</p></div>
   <div class="totals"><div class="total"><b>${mins}</b><span>Minutes</span></div><div class="total"><b>${run.done.length}</b><span>Moves</span></div><div class="total"><b>${run.reps}</b><span>Reps</span></div></div>
   <div class="ms-bar"><div class="row between"><strong>This month</strong><span style="color:var(--sess-muted);font-size:14px">${esc(msLine)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div><h3 style="margin-bottom:10px;font-size:20px">How did that feel?</h3>
    <div class="rate"><button data-act="rate" data-r="easy">Easy</button><button data-act="rate" data-r="right">Just right</button><button data-act="rate" data-r="tough">Tough</button></div>
    <p style="color:var(--sess-muted);font-size:13px;margin-top:10px">Your coach uses this to set the next session.</p></div>
  </div></div>`)}
function rate(r){const ch=[];const ids=run.done.filter(id=>!run.easier.includes(id)&&M[id].type!=='stretch');
  ids.forEach(id=>{const m=M[id];const p={...prog(id)};const top=m.ladder.length-1;
    if(r==='easy'){p.bump++;if(p.bump>2&&p.rung<top){p.rung++;p.bump=0;ch.push(`${m.name}: moved up to ${m.ladder[p.rung][0]} because it felt easy.`)}else if(p.bump>2){p.bump=2}else ch.push(`${m.name}: ${m.unit==='secs'?'+10 seconds':'+2 reps'} because it felt easy.`)}
    if(r==='tough'){if(p.bump>0){p.bump--;ch.push(`${m.name}: eased back ${m.unit==='secs'?'10 seconds':'2 reps'} after a tough session.`)}else if(p.rung>0){p.rung--;p.bump=1;ch.push(`${m.name}: back to ${m.ladder[p.rung][0]} to rebuild.`)}}
    S.progress[id]=p});
  run.easier.forEach(id=>ch.push(`${M[id].name}: dropped to ${M[id].ladder[prog(id).rung][0]} after you said it was too hard.`));
  if(r==='right'&&!ch.length)ch.push('Kept everything the same. It felt right, so we hold steady.');
  if(r==='easy'&&!ch.length)ch.push('Nice. Strength moves will step up next time.');
  S.changes=ch.slice(0,4);S.history.push({date:todayKey(),minutes:run.mins,moves:run.done.length,reps:run.reps,rating:r,focus:run.plan.focus||'custom'});
  save();run=null;closeLayer();location.hash='#today';render();toast('Saved. See you next time.')}

/* ---------- coach ---------- */
function apiKey(){try{return localStorage.getItem('md-key')||''}catch(e){return ''}}
async function callClaude(prompt){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:700,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('api '+r.status);const j=await r.json();const t=(j.content||[]).map(c=>c.text||'').join('');const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}
async function askCoach(text){chat.push({role:'user',text});chat.push({role:'coach',text:'Thinking…',thinking:true});render();
  let res=null;
  if(apiKey()){try{res=await callClaude(coachPrompt(text))}catch(e){res=null;toast('Couldn’t reach Claude, so the built-in coach answered. Check your API key in Nudges.')}}
  if(!res||typeof res.reply!=='string')res=localCoach(text);
  chat.pop();const msg={role:'coach',text:res.reply};
  if(res.session&&Array.isArray(res.session.moves)){const mv=res.session.moves.filter(x=>M[x.id]).map(x=>({id:x.id,sets:Math.max(1,Math.min(3,x.sets|0||1))}));
    if(mv.length)msg.session={date:todayKey(),title:String(res.session.title||'Coach’s session').slice(0,40),minutes:Math.max(5,Math.min(15,res.session.minutes|0||10)),reason:String(res.session.reason||'').slice(0,140),moves:mv,custom:true,focus:'custom'}}
  if(res.goal){S.goal=String(res.goal).slice(0,80);save()}
  chat.push(msg);saveChat();render()}
function coachPrompt(text){const hist=S.history.slice(-8).map(h=>`${h.date}: ${h.minutes}min, rated ${h.rating}`).join('; ')||'no sessions yet';
  const moves=MOVES.map(m=>{const t=target(m.id);return `${m.id} (${m.type}, ${m.area}; current rung: ${t.name}, ${amtText(t)})`}).join('\n');
  const convo=chat.filter(c=>!c.thinking).slice(-10).map(c=>`${c.role==='user'?'User':'Coach'}: ${c.text}`).join('\n');
  return `You are the Move Daily coach: a friendly personal trainer for home exercise (yoga stretches, Pilates and calisthenics). Equipment is only a mat and a chair. The user is ${S.name}, who dislikes the gym and wants a consistent daily habit of 5–15 minute sessions.
Tone: ${S.settings.tone==='drill'?'drill sergeant (blunt, short, but never cruel)':S.settings.tone}. British English. No emoji. Replies under 70 words. Never guilt-trip; always offer an easy way in.
Safety: if the user describes pain (rather than stiffness), sharp pain, numbness, or stiffness lasting several days, advise seeing a GP or physio, never push through pain, and offer only very gentle stretches or rest.
When the user mentions time, mood, stiffness, or asks for a session, include a session using ONLY these move ids. Keep at least one strength move unless they are in pain. Order: warm-up stretch first, cool-down stretch last. Roughly 1.5–2 minutes per move.
Moves:
${moves}
Today's planned session: ${todayPlan().moves.map(m=>m.id).join(', ')}.
Recent sessions: ${hist}. Current goal: ${S.goal||'none'}.
If the user states a goal in plain language (e.g. touch toes by summer), set "goal" to a short version of it and say which moves and milestones help.
Conversation so far:
${convo}

Respond with JSON only, no prose around it: {"reply": string, "session": null or {"title": string (max 4 words), "minutes": integer 5-15, "reason": string (one short line), "moves": [{"id": move id, "sets": 1-3}]}, "goal": null or string}`}
function localCoach(text){const t=text.toLowerCase();const m=t.match(/(\d{1,2})\s*(min|minute)/);let mins=m?Math.max(5,Math.min(15,+m[1])):null;
  if(/pain|hurt|sharp|injur|numb/.test(t))return {reply:'Let’s not push through pain. If it’s sharp, or stiffness has lasted several days, it’s worth seeing a GP or physio. For today, a very gentle stretch or a rest day is the right call.',session:{title:'Very gentle stretch',minutes:5,reason:'Gentle only.',moves:[{id:'cat-cow',sets:1},{id:'childs-pose',sets:1}]}};
  const goal=t.match(/(?:i want to|goal is to|i'd like to)\s+(.+)/);if(goal&&!/session|minute/.test(t))return {reply:`Great goal. I’ll lean on forward folds, down dog and low lunges, and the March and July milestones line up with it. Little and often gets you there.`,goal:goal[1].replace(/[.!]$/,''),session:null};
  const focus=/stiff|tight|back|sore|ache/.test(t)?'stiff':/hard|tough|push|more/.test(t)?'harder':(mins&&mins<=6)?'short':'plan';
  if(!mins)mins=focus==='short'?5:focus==='stiff'?8:S.settings.length;
  if(/why|change/.test(t))return {reply:S.changes.length?S.changes.join(' '):'No changes yet. Rate your next session and I’ll explain any adjustments here.',session:null};
  const s=build(mins,focus);const lines={stiff:`Got it. Here’s a ${mins}-minute session that’s kind to your back, with squats or a plank so you still build strength.`,harder:`Let’s step it up. One rung higher and an extra set on the strength moves.`,short:`Five minutes it is. Short sessions still count.`,plan:`Here’s a ${mins}-minute session that fits.`};
  return {reply:lines[focus],session:{title:s.title,minutes:mins,reason:s.reason,moves:s.moves,harder:s.harder}}}

/* ---------- canvases ---------- */
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function lerp(a,b,t){return a+(b-a)*t}
function drawFigure(c,m,t,dark){const ctx=c.getContext('2d');const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  const A=m.poses[0],B=m.poses[1];const pts=A.p.map((p,i)=>[lerp(p[0],B.p[i][0],t),lerp(p[1],B.p[i][1],t)]);const bend=lerp(A.b,B.b,t);
  const s=Math.min(W/100,H/66);const ox=(W-100*s)/2; // fit the 100 x 66 band (y 28..94)
  const tx=p=>[ox+p[0]*s, (p[1]-28)*s + (H-66*s)/2];
  const fg=dark?'#EEF3EF':col('--fg'),acc=dark?'#7BC29C':col('--accent'),floor=dark?'#2C3A31':col('--line');
  ctx.lineCap='round';ctx.lineJoin='round';
  // mat
  const fl=tx([0,91]);ctx.strokeStyle=floor;ctx.lineWidth=Math.max(2,s*1.6);ctx.beginPath();ctx.moveTo(tx([4,91])[0],fl[1]);ctx.lineTo(tx([96,91])[0],fl[1]);ctx.stroke();
  if(m.prop==='chair'){ctx.strokeStyle=floor;ctx.lineWidth=Math.max(2,s*2);ctx.beginPath();const a=tx([66,61]),b=tx([92,61]),c2=tx([92,34]),d=tx([68,90]),e=tx([90,90]);
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c2[0],c2[1]);ctx.moveTo(a[0]+2,a[1]);ctx.lineTo(d[0],d[1]);ctx.moveTo(b[0]-2,b[1]);ctx.lineTo(e[0],e[1]);ctx.stroke()}
  const [hd,sh,e1,w1,e2,w2,hp,k1,f1,k2,f2]=pts.map(tx);
  const line=(arr,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(arr[0][0],arr[0][1]);for(let i=1;i<arr.length;i++)ctx.lineTo(arr[i][0],arr[i][1]);ctx.stroke()};
  const lw=Math.max(3,s*3.2);
  // far limbs lighter
  ctx.globalAlpha=.45;line([hp,k2,f2],lw,acc);line([sh,e2,w2],lw*.85,acc);ctx.globalAlpha=1;
  // spine
  ctx.strokeStyle=fg;ctx.lineWidth=lw*1.25;ctx.beginPath();ctx.moveTo(sh[0],sh[1]);const mx=(sh[0]+hp[0])/2,my=(sh[1]+hp[1])/2+bend*s*2;ctx.quadraticCurveTo(mx,my,hp[0],hp[1]);ctx.stroke();
  line([hp,k1,f1],lw,acc);line([sh,e1,w1],lw*.85,acc);
  line([sh,[lerp(sh[0],hd[0],.45),lerp(sh[1],hd[1],.45)]],lw,fg);
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(hd[0],hd[1],s*4.6,0,Math.PI*2);ctx.fill()}
let anims=[];let raf=null;
function mountCanvases(){document.querySelectorAll('canvas[data-pose]').forEach(c=>{const m=M[c.dataset.pose];if(m)drawFigure(c,m,.5,false)});
  anims=[...document.querySelectorAll('canvas[data-anim]')];if(anims.length&&!raf)raf=requestAnimationFrame(loop)}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){anims=anims.filter(c=>c.isConnected);if(!anims.length){raf=null;return}
  const t=reduce?.5:(1-Math.cos(ts/2600*Math.PI*2))/2;anims.forEach(c=>drawFigure(c,M[c.dataset.anim],t,!!c.dataset.dark));raf=requestAnimationFrame(loop)}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());

/* ---------- toast ---------- */
let tt;function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;clearTimeout(tt);tt=setTimeout(()=>el.remove(),2600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='close-bg'&&e.target!==el)return;
  const st=S.settings;
  switch(a){
   case 'start':startSession(todayPlan());break;
   case 'nudge-start':startSession(todayPlan());break;
   case 'nudge-five':S.today=build(5,'short');save();startSession(S.today);break;
   case 'nudge-dismiss':S.dismissed={[todayKey()]:true};save();render();toast('No problem. Rest is part of the plan.');break;
   case 'swap':{const f=el.dataset.f;S.today=build(f==='short'?5:f==='stiff'?8:S.settings.length,f);save();render();break}
   case 'detail':openDetail(el.dataset.id);break;
   case 'close':case 'close-bg':closeLayer();break;
   case 'try':{const id=el.dataset.id;startSession({title:M[id].name,minutes:3,moves:[{id,sets:M[id].type==='stretch'?1:2}],focus:'custom'});break}
   case 'add':{const p=todayPlan();if(!p.moves.some(m=>m.id===el.dataset.id)){const at=Math.max(0,p.moves.length-1);p.moves.splice(at,0,{id:el.dataset.id,sets:M[el.dataset.id].type==='stretch'?1:2});p.minutes=Math.min(15,p.minutes+2);p.custom=true;save()}closeLayer();render();toast(`Added ${M[el.dataset.id].name} to today`);break}
   case 'done':nextSet(true);break;
   case 'skip':run.skipped.push(cur().id);nextSet(false);break;
   case 'toohard':tooHard();break;
   case 'quit':if(run.done.length){finish()}else{run=null;closeLayer()}break;
   case 'rate':rate(el.dataset.r);break;
   case 'suggest':askCoach(el.dataset.t);break;
   case 'voice':{const h=document.getElementById('voiceHint');h.hidden=!h.hidden;document.getElementById('ask').focus();break}
   case 'coach-start':startSession(chat[+el.dataset.i].session);break;
   case 'coach-today':S.today={...chat[+el.dataset.i].session};save();location.hash='#today';toast('Today’s session updated');break;
   case 'ms':{const k=el.dataset.k;S.milestones[k]=!S.milestones[k];save();render();break}
   case 'filter':libFilter=el.dataset.k;render();break;
   case 'slot':st.slot=el.dataset.k;save();render();break;
   case 'second':st.second=!st.second;save();render();break;
   case 'day':{const d=+el.dataset.d;st.days=st.days.includes(d)?st.days.filter(x=>x!==d):[...st.days,d];if(!st.days.length){st.days=[d];toast('Keep at least one session day')}S.today=null;save();render();break}
   case 'len':st.length=+el.dataset.n;S.today=null;save();render();break;
   case 'tone':st.tone=el.dataset.k;save();render();break;
   case 'savekey':{const v=document.getElementById('apiKey').value.trim();try{v?localStorage.setItem('md-key',v):localStorage.removeItem('md-key')}catch(e){}toast(v?'Key saved. The coach will use Claude.':'Key removed. Using the built-in coach.');break}
   case 'export':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`move-daily-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();break}
  }});
document.addEventListener('input',e=>{if(e.target.id==='libQ'){libQ=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('libQ');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='ask'){e.target.style.height='auto';e.target.style.height=Math.min(160,e.target.scrollHeight)+'px'}});
document.addEventListener('change',e=>{if(e.target.id==='slotTime'&&e.target.value){S.settings[S.settings.slot]=e.target.value;save();render()}
  if(e.target.id==='importFile'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.v)throw 0;S=Object.assign(structuredClone(DEF),d);save();render();toast('Backup restored')}catch(x){toast('That file isn’t a Move Daily backup.')}};fr.readAsText(e.target.files[0])}
  if(e.target.id==='nm'){S.name=e.target.value.trim()||S.name;save();toast('Name saved')}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='welcomeForm'){const v=document.getElementById('welcomeName').value.trim();if(!v)return;S.name=v.slice(0,30);save();document.getElementById('welcome').remove();render();toast(`Welcome, ${S.name}. Today’s session is ready.`);return}
  if(e.target.id==='composer'){const t=document.getElementById('ask');const v=t.value.trim();if(v){t.value='';askCoach(v)}}
  if(e.target.id==='testForm'){const rec={date:todayKey(),pressups:+document.getElementById('tPress').value,fold:+document.getElementById('tFold').value,plank:+document.getElementById('tPlank').value};
    const m=todayKey().slice(0,7);const i=S.tests.findIndex(t=>t.date.startsWith(m));if(i>=0)S.tests[i]=rec;else S.tests.push(rec);
    save();render();toast(S.tests.length===1?'Baseline saved':'Test saved')}});
document.addEventListener('keydown',e=>{if(e.target.id==='ask'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('composer').requestSubmit()}
  if(e.key==='Escape'&&document.querySelector('.sheet-bg'))closeLayer()});
addEventListener('hashchange',()=>{if(document.querySelector('.sheet-bg'))closeLayer();render();scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!run)render()});

function showWelcome(){if(document.getElementById('welcome'))return;const w=document.createElement('div');w.className='welcome';w.id='welcome';
  w.innerHTML=`<form id="welcomeForm" aria-labelledby="wTitle"><span class="brand-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M5 20l4-6 4 2 2-5 4 3"/><path d="M9 14l1-5 4-1"/></svg></span>
   <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Welcome to Move Daily</span><h1 id="wTitle">Short sessions at home. Every day.</h1>
   <p class="muted">Stretch, Pilates and bodyweight strength, 5 to 15 minutes at a time. All you need is a mat and a chair.</p></div>
   <label class="field" for="welcomeName" style="font-size:16px;font-weight:700">What should we call you?</label>
   <input id="welcomeName" autocomplete="given-name" maxlength="30" placeholder="Your first name" required>
   <button class="btn primary big">Let’s go</button>
   <p class="hint">Your progress is saved on this device only. You can change your name later in Nudges.</p></form>`;
  document.body.appendChild(w);setTimeout(()=>document.getElementById('welcomeName')?.focus(),50)}
render();
if(!S.name)showWelcome();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
